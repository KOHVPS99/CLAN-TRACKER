<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clan Tracker</title>

<style>
:root{
  --bg:#070A12;
  --panel:rgba(255,255,255,.06);
  --panel2:rgba(0,0,0,.28);
  --line:rgba(255,255,255,.14);
  --text:#EAF0FF;
  --muted:#A8B3D6;
  --gold:#facc15;
  --silver:#cbd5e1;
  --r:18px;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,Segoe UI,Arial;
  background:var(--bg);
  color:var(--text);
}
.wrap{max-width:1000px;margin:auto;padding:20px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
button{
  padding:10px 14px;
  border-radius:14px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.06);
  color:var(--text);
  font-weight:800;
  cursor:pointer;
}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--r);
  overflow:hidden;
}
.head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px;
  background:var(--panel2);
}
.left{display:flex;align-items:center;gap:12px}
.pfp{
  width:48px;height:48px;border-radius:14px;
  border:1px solid rgba(255,255,255,.2);
  object-fit:cover;
}
.place{
  font-size:12px;
  font-weight:900;
  padding:4px 10px;
  border-radius:999px;
  display:inline-block;
  margin-top:4px;
}
.first{color:var(--gold);border:1px solid rgba(250,204,21,.4)}
.second{color:var(--silver);border:1px solid rgba(203,213,225,.4)}
.rank{
  font-size:12px;
  border:1px solid var(--line);
  padding:6px 10px;
  border-radius:12px;
  white-space:nowrap;
}
.body{padding:14px}
.stat{
  border:1px solid var(--line);
  border-radius:14px;
  padding:10px;
  margin-bottom:8px;
}
.k{color:var(--muted);font-size:12px}
.v{font-size:15px;font-weight:900}
.toggle{
  margin-top:10px;
  font-weight:800;
  cursor:pointer;
  color:#9ecbff;
  user-select:none;
}
.members{
  display:none;
  margin-top:8px;
  max-height:220px;
  overflow:auto;
  border-top:1px solid var(--line);
  padding-top:8px;
}
.member{font-size:13px;padding:3px 0}
.officer{color:#facc15}
@media(max-width:800px){
  .grid{grid-template-columns:1fr}
}
</style>
</head>

<body>
<div class="wrap">
  <header>
    <h1>Clan Tracker</h1>
    <button onclick="loadAll()">Refresh</button>
  </header>

  <div class="grid">

    <!-- KOHV -->
    <div class="card">
      <div class="head">
        <div class="left">
          <img class="pfp"
            src="https://cdn.discordapp.com/attachments/1342188579761160342/1460643923956469953/F29791E5-9C85-4CEC-8A95-591B501D5B09.png?ex=696852e8&is=69670168&hm=356fa3caa0e29e4b76d958a9547ccec7e508295107d9c4d8278620554db77de3&"
            alt="KOHV">
          <div>
            <b>KOHV</b>
            <div class="place first">1st Clan</div>
          </div>
        </div>
        <div class="rank" id="rankKOHV">Rank —</div>
      </div>
      <div class="body" id="bodyKOHV">Loading…</div>
    </div>

    <!-- TAUX -->
    <div class="card">
      <div class="head">
        <div class="left">
          <img class="pfp"
            src="https://cdn.discordapp.com/attachments/1342188579761160342/1460645618027593963/433EDF80-E411-4268-B946-B55A4CD88F74.png?ex=6968547c&is=696702fc&hm=b71d8a59e81ecc250ae3dc1a9febb3c79c5cd01f586615784361575d1228c62d&"
            alt="TAUX">
          <div>
            <b>TAUX</b>
            <div class="place second">2nd Clan</div>
          </div>
        </div>
        <div class="rank" id="rankTAUX">Rank —</div>
      </div>
      <div class="body" id="bodyTAUX">Loading…</div>
    </div>

  </div>
</div>

<script>
async function getClan(name){
  return fetch(`/api/clan/${name}`).then(r=>r.json());
}
async function getRanks(){
  return fetch(`/api/clans`).then(r=>r.json());
}
function findRank(list,name){
  const i = list.findIndex(x => x.Name === name);
  return i === -1 ? null : i + 1;
}
function render(name,data,list){
  const body = document.getElementById("body"+name);
  const rank = findRank(list, name);

  document.getElementById("rank"+name).textContent =
    rank ? `Rank #${rank}` : "Rank —";

  if(!(data?.status === "ok" && data?.data)){
    body.innerHTML = `<div style="color:#ffb4b4;font-weight:900">Couldn’t load ${name}.</div>`;
    return;
  }

  const fmt = n => new Intl.NumberFormat().format(n);

  const c = data.data;
  const members = Array.isArray(c.Members) ? c.Members : [];
  const officers = members.filter(m => m && (m.PermissionLevel ?? 0) >= 80);
  const regular  = members.filter(m => m && (m.PermissionLevel ?? 0) < 80);

  const current = rank ? list[rank-1] : null;
  const above   = rank ? list[rank-2] : null;
  const below   = rank ? list[rank]   : null;

  const toOvertake = (rank && above && current)
    ? `#${rank-1} — ${above.Name} (${fmt(above.Points - current.Points + 1)} pts)`
    : (rank === 1 ? "Top clan" : "—");

  const atRisk = (rank && below && current)
    ? `#${rank+1} — ${below.Name} (${fmt(current.Points - below.Points + 1)} pts)`
    : "—";

  body.innerHTML = `
    <div class="stat"><div class="k">Members</div><div class="v">${fmt(members.length)}</div></div>
    <div class="stat"><div class="k">To overtake</div><div class="v">${toOvertake}</div></div>
    <div class="stat"><div class="k">At risk from</div><div class="v">${atRisk}</div></div>

    <div class="toggle" onclick="toggleMembers(this)">▶ Show members</div>
    <div class="members">
      <b>Officers (${fmt(officers.length)})</b>
      ${officers.map(m=>`<div class="member officer">${m.UserID}</div>`).join("") || `<div class="member">—</div>`}
      <b style="margin-top:6px;display:block">Members (${fmt(regular.length)})</b>
      ${regular.map(m=>`<div class="member">${m.UserID}</div>`).join("") || `<div class="member">—</div>`}
    </div>
  `;
}

function toggleMembers(el){
  const box = el.nextElementSibling;
  const open = box.style.display === "block";
  box.style.display = open ? "none" : "block";
  el.textContent = open ? "▶ Show members" : "▼ Hide members";
}

async function loadAll(){
  const [k,t,r] = await Promise.all([
    getClan("KOHV"),
    getClan("TAUX"),
    getRanks()
  ]);
  const list = r?.data || [];
  render("KOHV", k, list);
  render("TAUX", t, list);
}
loadAll();
</script>
</body>
</html>
